name: BFL checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bfl
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bfl
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bfl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bfl:ci-only-password@127.0.0.1:5432/bfl
      DJANGO_SECRET_KEY: ci-only-secret-never-use-in-production-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate
      - run: python backend/manage.py test tests --noinput
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

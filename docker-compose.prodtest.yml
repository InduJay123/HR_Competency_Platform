name: bfl-prodtest

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  backend:
    build:
      context: ./backend

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
      REDIS_URL: redis://redis:6379/0

    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --worker-class
      - gthread
      - --threads
      - "4"
      - --timeout
      - "90"
      - --graceful-timeout
      - "30"
      - --access-logfile
      - "-"

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped


  worker:
      build:
        context: ./backend

      env_file:
        - .env

      environment:
        DJANGO_SETTINGS_MODULE: config.settings.docker
        REDIS_URL: redis://redis:6379/0

      command:
        - celery
        - -A
        - config
        - worker
        - -l
        - info

      depends_on:
        redis:
          condition: service_healthy

      restart: unless-stopped


  beat:
    build:
      context: ./backend

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker
      REDIS_URL: redis://redis:6379/0

    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info
      - --schedule
      - /tmp/celerybeat-schedule

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        BACKEND_URL: http://backend:8000

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  redis_data: